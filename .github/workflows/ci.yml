name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, build, and smoke test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/

      - name: Test
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv run python -m build

      - name: Smoke test
        run: uv run quin-scanner --help

  oldest:
    name: Tests on the oldest allowed dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install the oldest allowed runtime dependencies
        # Floors in pyproject.toml are only real if something runs on them: resolve every direct
        # dependency to its lowest allowed version, then add current test tools without moving them.
        run: |
          uv venv --python 3.11 .venv-oldest
          uv pip install --python .venv-oldest/bin/python --resolution lowest-direct -e .
          uv pip freeze --python .venv-oldest/bin/python | grep -v -e '^-e' -e quin-scanner > oldest-constraints.txt
          python3 - <<'PY' > dev-tools.txt
          import re, tomllib
          dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]
          print("\n".join(re.split(r"[<>=!~ ]", requirement, maxsplit=1)[0] for requirement in dev))
          PY
          uv pip install --python .venv-oldest/bin/python -c oldest-constraints.txt -r dev-tools.txt

      - name: Show the versions under test
        run: uv pip list --python .venv-oldest/bin/python | grep -i -E "^(click|pyyaml|openai|anthropic|google-genai|httpx|python-dotenv) "

      - name: Test
        run: .venv-oldest/bin/python -m pytest tests/ -v

  platforms:
    name: Tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Smoke test
        run: uv run quin-scanner --help

      - name: Test
        run: uv run pytest tests/ -v --tb=short
