name: Frontend

# The web UI in ui/ is experimental. This builds it whenever it changes so a broken
# build is caught, but it is deliberately not a required check: a path-filtered
# workflow never reports on other pull requests.

on:
  push:
    branches: [main]
    paths: ["ui/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["ui/frontend/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    name: Build the experimental frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Reports only: src/pages/Home.tsx still has React render-purity errors that need
        # a refactor. Remove continue-on-error once they are fixed.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
