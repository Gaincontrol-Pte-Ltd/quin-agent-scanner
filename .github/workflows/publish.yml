name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  move-major-tag:
    name: Move floating tag
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the floating tag for this release
        # Stable vX.Y.Z -> vX (major tag). Pre-release vX.Y.Z(a|b|rc)N -> beta.
        # Pre-releases never move a major tag, so @v1 users do not receive betas.
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            floating="v${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            floating="beta"
          else
            echo "Tag $GITHUB_REF_NAME is not a recognised release tag; not moving a floating tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$floating" "$GITHUB_REF_NAME^{commit}"
          git push origin "$floating" --force
          echo "Moved $floating to $GITHUB_REF_NAME"


  github-release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Create or update the GitHub Release
        # The body is this version's CHANGELOG section. Pre-releases (aN, bN, rcN) are
        # marked as such so they never show as the latest release. Re-running a failed
        # publish updates the existing release instead of erroring.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_notes.py "$TAG" > notes.md
          flags=()
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
