name: Bug report
description: Quin crashed, printed a wrong error, or behaved differently from the docs
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Quin version
      description: Output of `quin-scanner --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: macOS 15, Python 3.12
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or Action step
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened, and what you expected
      description: Include the full error output. Remove any secrets.
    validations:
      required: true
