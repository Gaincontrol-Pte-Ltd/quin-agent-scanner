[project]
name = "quin-scanner"
version = "0.1.0b2"
description = "Scan repositories to detect GenAI and Agentic AI applications, identify LLM usage, and analyze agent intent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Quin Agent Scanner Contributors" },
]
keywords = ["ai", "scanner", "security", "agent", "llm", "genai", "compliance", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "jinja2>=3.1",
]

[project.scripts]
quin-scanner = "quin_scanner.cli:cli"

[project.urls]
Homepage = "https://github.com/Gaincontrol-Pte-Ltd/quin-agent-scanner"
Documentation = "https://github.com/Gaincontrol-Pte-Ltd/quin-agent-scanner#readme"
Repository = "https://github.com/Gaincontrol-Pte-Ltd/quin-agent-scanner"
Issues = "https://github.com/Gaincontrol-Pte-Ltd/quin-agent-scanner/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quin_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["quin_scanner"]

[tool.coverage.report]
show_missing = true
skip_empty = true
