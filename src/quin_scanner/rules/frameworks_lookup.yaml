# Hybrid framework detection lookup table
# Maps known package names and file markers to canonical framework names.
# Rule-based detection runs before synthesis; result is passed as a candidate.
#
# Priority: file_markers > packages (first match wins within each group).

# Dependency package name → framework
# Checked against DependencyScanner findings
packages:
  # More specific entries first — iteration is in YAML order (highest priority wins).
  # Do NOT add generic SDK packages (anthropic, openai, google-generativeai) here —
  # they are too broad and cause false framework assignments.
  metagpt: "MetaGPT"
  autogen-agentchat: "AutoGen"
  autogen_agentchat: "AutoGen"
  pyautogen: "AutoGen"
  autogen-core: "AutoGen"
  autogen-ext: "AutoGen"
  openai-agents: "OpenAI Agents SDK"
  anthropic-agents: "Anthropic Agent SDK"
  google-adk: "Google ADK"
  llama-index: "LlamaIndex"
  llama_index: "LlamaIndex"
  llama-index-core: "LlamaIndex"
  haystack-ai: "Haystack"
  farm-haystack: "Haystack"
  semantic-kernel: "Semantic Kernel"
  promptflow: "PromptFlow"
  promptflow-core: "PromptFlow"
  mcp: "MCP"
  modelcontextprotocol: "MCP"
  crewai: "CrewAI"
  dify: "Dify"
  ai: "Vercel AI SDK"
  "@ai-sdk/openai": "Vercel AI SDK"
  "@ai-sdk/anthropic": "Vercel AI SDK"
  "@ai-sdk/google": "Vercel AI SDK"
  langgraph: "LangGraph"
  flowise: "Flowise"
  langchain: "LangChain"
  langchain-core: "LangChain"
  langchain-community: "LangChain"
  openclaw: "OpenClaw"

# File marker name → framework
# Checked against FrameworkMarkerScanner findings (file names)
file_markers:
  crew.yaml: "CrewAI"
  flow.dag.yaml: "PromptFlow"
  adk.json: "Google ADK"
  mcp.json: "MCP"
  .mcp.json: "MCP"
  langgraph.json: "LangGraph"
  openclaw.json: "OpenClaw"

# Framework → (OSV ecosystem, canonical package name for queries)
# Used by VulnChecker to query OSV.dev. Ecosystems follow OSV conventions:
# https://ossf.github.io/osv-schema/#affectedpackage-field
# Frameworks not listed here are skipped for OSV lookup (web search may still run).
ecosystems:
  CrewAI:
    ecosystem: "PyPI"
    package: "crewai"
  LangChain:
    ecosystem: "PyPI"
    package: "langchain"
  LangGraph:
    ecosystem: "PyPI"
    package: "langgraph"
  LlamaIndex:
    ecosystem: "PyPI"
    package: "llama-index"
  Haystack:
    ecosystem: "PyPI"
    package: "haystack-ai"
  AutoGen:
    ecosystem: "PyPI"
    package: "autogen-agentchat"
  MetaGPT:
    ecosystem: "PyPI"
    package: "metagpt"
  "Semantic Kernel":
    ecosystem: "PyPI"
    package: "semantic-kernel"
  PromptFlow:
    ecosystem: "PyPI"
    package: "promptflow"
  "OpenAI Agents SDK":
    ecosystem: "PyPI"
    package: "openai-agents"
  "Google ADK":
    ecosystem: "PyPI"
    package: "google-adk"
  MCP:
    ecosystem: "PyPI"
    package: "mcp"
  Dify:
    ecosystem: "PyPI"
    package: "dify"
  OpenClaw:
    ecosystem: "PyPI"
    package: "openclaw"
  "Vercel AI SDK":
    ecosystem: "npm"
    package: "ai"
  Flowise:
    ecosystem: "npm"
    package: "flowise"
